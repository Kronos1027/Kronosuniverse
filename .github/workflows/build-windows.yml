name: Build Windows

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-sqlite3
            make

      - name: Build
        shell: msys2 {0}
        run: |
          cd $GITHUB_WORKSPACE
          mkdir build
          cd build
          cmake -G "MSYS Makefiles" ..
          make kronouniverse -j4

      - name: Package
        shell: pwsh
        run: |
          mkdir release
          cp build/kronouniverse.exe release/
          $mingw = "C:\msys64\mingw64\bin"
          cp "$mingw\SDL2.dll" release/ 2>$null
          cp "$mingw\libgcc_s_seh-1.dll" release/
          cp "$mingw\libstdc++-6.dll" release/
          cp "$mingw\libwinpthread-1.dll" release/
          cp "$mingw\sqlite3.dll" release/ 2>$null
          Compress-Archive -Path release/* -DestinationPath KronoUniverse-windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KronoUniverse-windows-x64.zip
          name: KronoUniverse ${{ github.ref_name }}
          body: |
            ## KronoUniverse — Windows x64
            
            ### Como jogar
            1. Baixe e extraia o zip
            2. Execute kronouniverse.exe
            3. Controles:
               - A/D ou setas = mover
               - W/Space = pular
               - Shift = correr
               - S = agachar
               - Scroll do mouse = zoom
               - Botão esquerdo = cavar bloco
               - Botão direito = colocar bloco
               - F1 = info de debug
               - F2 = trocar tipo de bloco
               - ESC = sair
            
            ### Features
            - Mundo procedural (Perlin noise multi-camada)
            - 14 tipos de bloco com propriedades diferentes
            - Mining e building
            - Física de personagem (gravidade, salto, atrito, dano de queda)
            - Biomas (plains, forest, desert, tundra, volcanic)
            - Cavernas, minérios, árvores
            - Câmera com zoom
            - Bedrock indestrutível
            
            Feito por Darlan (NATSKY)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
